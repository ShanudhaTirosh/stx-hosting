services:
  # Placeholder for "soketi" overrides in docker-compose.custom.yml from versions before 4.4.
  # Realtime runs inside the STX Hosting platform container now. Without this entry, such an override is an
  # incomplete service and every upgrade fails. Zero replicas means it never starts, and
  # "docker compose up" removes any legacy realtime container (an inactive profile keeps it).
  # It uses the STX Hosting platform image, so install and upgrade do not pull another image.
  soketi:
    image: "${REGISTRY_URL:-ghcr.io}/stxhosting/platform:${LATEST_IMAGE:-latest}"
    deploy:
      replicas: 0
  stx:
    image: "${REGISTRY_URL:-ghcr.io}/stxhosting/platform:${LATEST_IMAGE:-latest}"
    volumes:
      - type: bind
        source: ${DATA_DIR:-/data/stx}/source/.env
        target: /var/www/html/.env
        read_only: true
      - ${DATA_DIR:-/data/stx}/ssh:/var/www/html/storage/app/ssh
      - ${DATA_DIR:-/data/stx}/applications:/var/www/html/storage/app/applications
      - ${DATA_DIR:-/data/stx}/databases:/var/www/html/storage/app/databases
      - ${DATA_DIR:-/data/stx}/services:/var/www/html/storage/app/services
      - ${DATA_DIR:-/data/stx}/backups:/var/www/html/storage/app/backups
      - ${DATA_DIR:-/data/stx}/images:/var/www/html/storage/app/images
    environment:
      - APP_ENV=${APP_ENV:-production}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-256M}
      - PHP_FPM_PM_CONTROL=${PHP_FPM_PM_CONTROL:-dynamic}
      - PHP_FPM_PM_START_SERVERS=${PHP_FPM_PM_START_SERVERS:-1}
      - PHP_FPM_PM_MIN_SPARE_SERVERS=${PHP_FPM_PM_MIN_SPARE_SERVERS:-1}
      - PHP_FPM_PM_MAX_SPARE_SERVERS=${PHP_FPM_PM_MAX_SPARE_SERVERS:-10}
      - PUSHER_BACKEND_PORT=${PUSHER_BACKEND_PORT:-6001}
    env_file:
      - ${DATA_DIR:-/data/stx}/source/.env
    ports:
      - "${APP_PORT:-8000}:8080"
      - "${REVERB_PORT:-${SOKETI_PORT:-6001}}:6001"
      - "6002:6002"
    expose:
      - "${APP_PORT:-8000}"
      - "6001"
      - "6002"
    networks:
      stx:
        # Realtime ran in the stx-realtime container before 4.4; keep the name for existing proxy upstreams.
        aliases:
          - stx-realtime
          - stx-realtime
    healthcheck:
      test: curl --fail http://127.0.0.1:8080/api/health && curl --fail http://127.0.0.1:${PUSHER_BACKEND_PORT:-6001}/up || exit 1
      interval: 5s
      retries: 24
      start_period: 1m
      timeout: 2s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    volumes:
      - stx-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_DATABASE:-stx}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME}", "-d", "${DB_DATABASE:-stx}" ]
      interval: 5s
      retries: 10
      timeout: 2s
  redis:
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - stx-redis:/data
    healthcheck:
      test: redis-cli ping
      interval: 5s
      retries: 10
      timeout: 2s
volumes:
  stx-db:
    name: stx-db
  stx-redis:
    name: stx-redis

networks:
  stx:
    name: stx
    external: true
  coolify:
    name: coolify
    external: true
