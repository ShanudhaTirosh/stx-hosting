# docker/supabase/kong.yml
# Declarative Kong Gateway Routing Configuration for Self-Hosted Supabase

_format_version: "2.1"
_transform: true

services:
  # 1. Auth Service (GoTrue)
  - name: auth-v1
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1

  # 2. PostgREST REST API
  - name: rest-v1
    url: http://supabase-rest:3000/
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1

  # 3. Realtime WebSockets & Broadcast
  - name: realtime-v1
    url: http://supabase-realtime:4000/
    routes:
      - name: realtime-v1-route
        strip_path: true
        paths:
          - /realtime/v1

  # 4. Storage API
  - name: storage-v1
    url: http://supabase-storage:5000/
    routes:
      - name: storage-v1-route
        strip_path: true
        paths:
          - /storage/v1

  # 5. Edge Functions Runtime
  - name: functions-v1
    url: http://supabase-edge-runtime:9000/
    routes:
      - name: functions-v1-route
        strip_path: true
        paths:
          - /functions/v1

  # 6. Status & Health Check
  - name: status
    url: http://supabase-rest:3000/
    routes:
      - name: status-route
        strip_path: false
        paths:
          - /status

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - authorization
        - content-type
        - apikey
        - x-client-info
        - prefer
      exposed_headers:
        - content-range
        - x-total-count
      credentials: true
      max_age: 3600

