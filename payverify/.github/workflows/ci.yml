name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pg, POSTGRES_DB: pv_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PV_TEST_DATABASE_URL: postgresql+psycopg2://postgres:pg@localhost:5432/pv_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r payverify/requirements.txt
      - run: cd payverify && PV_DATABASE_URL=$PV_TEST_DATABASE_URL alembic upgrade head && PV_DATABASE_URL=$PV_TEST_DATABASE_URL alembic check
      - run: cd payverify && python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd payverify-web && npm ci && npx next build && npm audit --omit=dev

  whatsapp-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd payverify-whatsapp-bot && npm ci && npx tsc --noEmit && npx tsx --test src/parser.test.ts
