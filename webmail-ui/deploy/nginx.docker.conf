# nginx.docker.conf
# Webmail containerized Nginx configuration running behind Caddy Edge Proxy
include /etc/nginx/webmail-upstream.conf;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/webmail/public;
    server_tokens off;

    # Attachment upload limits
    client_max_body_size 30m;
    client_body_timeout 60s;
    error_page 413 @too_large;

    location @too_large {
        default_type text/html;
        return 413 '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload too large</title><body style="font:16px system-ui;max-width:32rem;margin:4rem auto;padding:0 1rem"><h1>Upload too large</h1><p>The files you tried to send are larger than this server accepts. Go back, remove some attachments and try again.</p><p><a href="/">Back to mail</a></p>';
    }

    # Never execute or reveal PHP files directly
    location ~ \.php$ { return 404; }

    # Deny dot-files (.env, .git, etc.)
    location ~ /\. { deny all; }

    # Static assets cache
    location /assets/ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Main application routing
    location / {
        try_files /nonexistent-so-always-use-the-app @app;
    }

    location @app {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param HTTPS           $http_x_forwarded_proto;
        fastcgi_pass webmail_php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
    }

    # Compression for static text
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;
}

