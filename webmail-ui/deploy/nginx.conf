# Webmail: nginx site (TLS). Copy to /etc/nginx/sites-available/webmail, adjust the three marked lines, then:
#   nginx -t && systemctl reload nginx
# Only /assets/ is ever served as a static file; everything else goes to public/index.php.

include /etc/nginx/webmail-upstream.conf;        # defines "upstream webmail_php" (see deploy/webmail-upstream.conf)

server {
    listen 80;
    listen [::]:80;
    server_name mail.example.org;                                   # <-- your host name
    location /.well-known/acme-challenge/ { root /var/www/acme; }   # Let's Encrypt HTTP-01 (optional)
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.example.org;                                   # <-- your host name

    ssl_certificate     /etc/letsencrypt/live/mail.example.org/fullchain.pem;   # <-- your certificate
    ssl_certificate_key /etc/letsencrypt/live/mail.example.org/privkey.pem;     # <-- your key
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/webmail/public;
    server_tokens off;

    # Must be >= post_max_size in php-webmail.ini (attachments are base64-encoded by the browser form, so keep some headroom).
    client_max_body_size 30m;
    client_body_timeout 60s;
    error_page 413 @too_large;
    location @too_large {
        default_type text/html;
        return 413 '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload too large</title><body style="font:16px system-ui;max-width:32rem;margin:4rem auto;padding:0 1rem"><h1>Upload too large</h1><p>The files you tried to send are larger than this server accepts. Go back, remove some attachments and try again.</p><p><a href="/">Back to mail</a></p>';
    }

    # Never execute or reveal PHP files directly; the app is reached only through the named location below.
    location ~ \.php$ { return 404; }
    # Dot-files (.env, .git, ...) are never served.
    location ~ /\. { deny all; }

    location /assets/ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location / { try_files /nonexistent-so-always-use-the-app @app; }

    location @app {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_pass webmail_php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
    }

    # Compress static text only (not HTML: compressing pages that carry secrets enables BREACH-style attacks).
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;
}
