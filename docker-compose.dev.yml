services:
  stx:
    image: stx:dev
    pull_policy: never
    build:
      context: .
      dockerfile: ./docker/development/Dockerfile
      args:
        - USER_ID=${USERID:-1000}
        - GROUP_ID=${GROUPID:-1000}
    ports:
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8000}:8080"
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:${FORWARD_PUSHER_PORT:-6001}:6001"
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:6002:6002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AUTORUN_ENABLED: false
      COMPOSER_PROCESS_TIMEOUT: 0
      PHP_OPCACHE_ENABLE: 1
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: 1
      PHP_OPCACHE_REVALIDATE_FREQ: 0
      PHP_OPCACHE_MEMORY_CONSUMPTION: 256
      PHP_OPCACHE_MAX_ACCELERATED_FILES: 30000
      STX_CONTAINER_ROLE: "${STX_CONTAINER_ROLE:-all}"
      PUSHER_HOST: "${PUSHER_HOST:-}"
      PUSHER_PORT: "${PUSHER_PORT:-6001}"
      PUSHER_BACKEND_PORT: "${PUSHER_BACKEND_PORT:-6001}"
      PUSHER_SCHEME: "${PUSHER_SCHEME:-http}"
      PUSHER_APP_ID: "${PUSHER_APP_ID:-stx}"
      PUSHER_APP_KEY: "${PUSHER_APP_KEY:-stx}"
      PUSHER_APP_SECRET: "${PUSHER_APP_SECRET:-stx}"
    healthcheck:
      test: curl -sf http://127.0.0.1:8080/api/health || exit 1
      interval: 15s
      retries: 30
      start_period: 300s
      timeout: 20s
    volumes:
      - .:/var/www/html/:cached
      - dev_backups_data:/var/www/html/storage/app/backups
      - ./docker/stx-terminal/terminal-server.js:/terminal/terminal-server.js
      - ./docker/stx-terminal/terminal-utils.js:/terminal/terminal-utils.js
      - ./docker/development/etc/s6-overlay/scripts/init-setup.sh:/etc/s6-overlay/scripts/init-setup.sh:ro
    networks:
      - stx
  postgres:
    pull_policy: always
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: "${DB_USERNAME:-stx}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-password}"
      POSTGRES_DB: "${DB_DATABASE:-stx}"
      POSTGRES_HOST_AUTH_METHOD: "trust"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      retries: 10
      timeout: 2s
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
  redis:
    pull_policy: always
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    env_file:
      - .env
    healthcheck:
      test: redis-cli ping
      interval: 5s
      retries: 10
      timeout: 2s
    volumes:
      - dev_redis_data:/data
  vite:
    image: node:24-alpine
    pull_policy: always
    container_name: stx-vite
    working_dir: /var/www/html
    environment:
      # Set VITE_HOST in .env to a browser-reachable IP/hostname for LAN/Tailscale access
      VITE_HOST: "${VITE_HOST:-localhost}"
      VITE_PORT: "${VITE_PORT:-5173}"
      VITE_PROTOCOL: "${VITE_PROTOCOL:-http}"
    ports:
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    volumes:
      - .:/var/www/html/:cached
    command: sh -c "npm install && npm run dev"
    networks:
      - stx
  testing-host:
    image: stx-testing-host:dev
    pull_policy: never
    build:
      context: .
      dockerfile: ./docker/testing-host/Dockerfile
    init: true
    container_name: stx-testing-host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dev_stx_data:/data/stx
      - dev_stx_data:/var/lib/docker/volumes/stx_dev_stx_data/_data
      - dev_backups_data:/data/stx/backups
      - dev_postgres_data:/data/stx/_volumes/database
      - dev_redis_data:/data/stx/_volumes/redis
      - dev_minio_data:/data/stx/_volumes/minio
    networks:
      - stx
  mailpit:
    image: axllent/mailpit:latest
    pull_policy: always
    container_name: stx-mail
    ports:
      - "${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
    networks:
      - stx
  minio:
    image: coollabsio/maxio:latest
    pull_policy: always
    container_name: stx-minio
    ports:
      - "${FORWARD_MINIO_PORT:-9000}:9000"
      - "${FORWARD_MINIO_PORT_CONSOLE:-9001}:9001"
    environment:
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - dev_minio_data:/data
    networks:
      - stx
  minio-init:
    image: ghcr.io/coollabsio/mx:0.1.0
    pull_policy: always
    container_name: stx-minio-init
    restart: no
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      until mc alias set local http://stx-minio:9000 minioadmin minioadmin 2>/dev/null; do
        echo 'MinIO not ready yet, waiting...';
        sleep 2;
      done;
      echo 'MinIO is ready, creating bucket if needed...';
      mc mb local/local --ignore-existing;
      echo 'MinIO initialization complete - bucket local is ready';
      "
    networks:
      - stx

volumes:
  dev_backups_data:
  dev_postgres_data:
  dev_redis_data:
  dev_stx_data:
  dev_minio_data:

networks:
  stx:
    name: stx
    external: false
