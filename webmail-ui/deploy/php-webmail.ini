; Put in /etc/php/8.3/fpm/conf.d/99-webmail.ini (php:8.3-fpm images: /usr/local/etc/php/conf.d/).
; Verify with:  php bin/check-config.php --php-ini=deploy/php-webmail.ini

; --- attachments: keep in step with MAX_ATTACHMENT_MB / MAX_MESSAGE_MB in .env and client_max_body_size in nginx.conf
upload_max_filesize = 25M
post_max_size       = 30M
max_file_uploads    = 20
memory_limit        = 256M        ; attachments are base64-encoded into the API request (~4x the message size)

; --- hygiene
expose_php          = Off
display_errors      = Off
display_startup_errors = Off
log_errors          = On
html_errors         = Off
zend.assertions     = -1
allow_url_include   = Off
default_charset     = "UTF-8"
date.timezone       = UTC
disable_functions   = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source,highlight_file

; --- performance
opcache.enable                  = 1
opcache.memory_consumption      = 64
opcache.interned_strings_buffer = 8
opcache.validate_timestamps     = 1
opcache.revalidate_freq         = 60
