# docker/mail/config/zonemta.toml
# Production ZoneMTA Configuration for STX Cloud Platform Mail Stack

[general]
title = "STX Outbound Mail Transfer Agent"
hostname = "mail.stxcloud.com"
verbose = false

[dbs.mongo]
url = "mongodb://wildduck-mongo:27017/zonemta"
maxPoolSize = 50
minPoolSize = 5

[dbs.redis]
host = "wildduck-redis"
port = 6379
db = 2

[zones.default]
# Default delivery zone
processes = 2
connections = 10
rate = 50

[plugins."dkim"]
enabled = true
source = "mongodb"

[plugins."loop-detect"]
enabled = true
maxHops = 30

[api]
enabled = true
port = 8080
host = "0.0.0.0"
