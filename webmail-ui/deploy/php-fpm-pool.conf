; /etc/php/8.3/fpm/pool.d/webmail.conf  (remove the default www.conf pool if you do not need it)
[webmail]
user  = www-data
group = www-data
listen = /run/php/webmail.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

pm = dynamic
pm.max_children      = 20
pm.start_servers     = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests      = 500
request_terminate_timeout = 90s

clear_env = yes                   ; configuration comes from /srv/webmail/.env, not from inherited environment
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php

php_admin_flag[log_errors]     = on
php_admin_flag[display_errors] = off
php_admin_value[error_log]     = /var/log/php8.3-fpm-webmail.log
php_admin_value[open_basedir]  = /srv/webmail:/var/lib/webmail:/tmp
php_admin_value[session.save_path] = /var/lib/webmail/sessions
