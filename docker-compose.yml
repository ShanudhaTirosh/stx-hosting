services:
    stx:
        aliases:
            - stx

            - coolify
        container_name: stx
        restart: always
        working_dir: /var/www/html
        extra_hosts:
            - host.docker.internal:host-gateway
        expose:
            - "6001"
            - "6002"
        networks:
            - stx

            - coolify
        depends_on:
            - postgres
            - redis
    postgres:
        image: postgres:15-alpine
        container_name: stx-db
        restart: always
        networks:
            - stx

            - coolify
    redis:
        image: redis:7-alpine
        container_name: stx-redis
        restart: always
        networks:
            - stx

            - coolify
networks:
    stx:
        aliases:
            - stx

            - coolify
        name: coolify
        driver: bridge
        external: false
