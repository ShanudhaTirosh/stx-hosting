# UNTESTED here (no Docker in my build sandbox). The pieces were tested separately: the API image's commands, the Next.js
# standalone server, and the proxy behaviour. Run `docker compose -f deploy/docker-compose.prod.yml config` first.
# Usage:  cp deploy/.env.example deploy/.env  (fill it in)  then  docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml up -d --build
name: payverify
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: payverify
      POSTGRES_USER: payverify
      POSTGRES_PASSWORD: ${PV_DB_PASSWORD:?}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U payverify"], interval: 5s, timeout: 5s, retries: 10 }

  api:
    build: ../payverify
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment: &apienv
      PV_ENV: production
      PV_DATABASE_URL: postgresql+psycopg2://payverify:${PV_DB_PASSWORD}@db:5432/payverify
      PV_JWT_SECRET: ${PV_JWT_SECRET:?}
      PV_DATA_KEY: ${PV_DATA_KEY:?}
      PV_BANK_ACCOUNT_TAIL: ${PV_BANK_ACCOUNT_TAIL:?}
      PV_PAY_TO_ACCOUNT_NAME: ${PV_PAY_TO_ACCOUNT_NAME:?}
      PV_PAY_TO_ACCOUNT_NUMBER: ${PV_PAY_TO_ACCOUNT_NUMBER:?}
      PV_CORS_ORIGINS: https://${PUBLIC_HOST:?}
      PV_STORAGE_DIR: /srv/storage
      PV_SMS_SENDER_ALLOWLIST: ${PV_SMS_SENDER_ALLOWLIST:-COMBANK}
      PV_COMBANK_NIC: ${PV_COMBANK_NIC:-}
      PV_COMBANK_WHATSAPP_NUMBER: ${PV_COMBANK_WHATSAPP_NUMBER:-}
      PV_WHATSAPP_BOT_URL: http://whatsapp-bot:3100
      PV_WHATSAPP_BOT_SECRET: ${PV_WHATSAPP_BOT_SECRET:-}
      PV_EXTRACTION_ENABLED: ${PV_EXTRACTION_ENABLED:-false}
      PV_AI_PROVIDER: ${PV_AI_PROVIDER:-none}
      PV_GEMINI_API_KEY: ${PV_GEMINI_API_KEY:-}
      PV_GEMINI_MODEL: ${PV_GEMINI_MODEL:-gemini-2.5-flash}
      PV_OLLAMA_URL: ${PV_OLLAMA_URL:-http://localhost:11434}
      PV_OLLAMA_MODEL: ${PV_OLLAMA_MODEL:-llama3.2-vision}
      PV_EXTERNAL_API_KEY: ${PV_EXTERNAL_API_KEY:-}
      PV_EXTERNAL_WEBHOOK_URL: ${PV_EXTERNAL_WEBHOOK_URL:-}
      PV_EXTERNAL_WEBHOOK_SECRET: ${PV_EXTERNAL_WEBHOOK_SECRET:-}
      PV_AUTO_RECEIPT_TO_LEDGER: ${PV_AUTO_RECEIPT_TO_LEDGER:-true}
      PV_BOT_SYNC_ON_CLAIM: ${PV_BOT_SYNC_ON_CLAIM:-false}
      PV_SUPABASE_SYNC_ENABLED: ${PV_SUPABASE_SYNC_ENABLED:-false}
      PV_SUPABASE_URL: ${PV_SUPABASE_URL:-}
      PV_SUPABASE_SERVICE_KEY: ${PV_SUPABASE_SERVICE_KEY:-}
      PV_ANTHROPIC_API_KEY: ${PV_ANTHROPIC_API_KEY:-}
      PV_OCR_ENGINE: ${PV_OCR_ENGINE:-none}
      # The API port is not published; only web and caddy (on this private network) can reach it, so trusting
      # forwarded headers from them is acceptable. Do not publish port 8000 if you keep this.
      FORWARDED_ALLOW_IPS: "*"
    volumes: [proofs:/srv/storage]
    # no ports: reachable only inside the compose network

  web:
    build: ../payverify-web
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_URL: http://api:8000

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [web, api]
    ports: ["80:80", "443:443"]
    environment: { PUBLIC_HOST: "${PUBLIC_HOST}", PHONE_API_HOST: "${PHONE_API_HOST}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]

  whatsapp-bot:
    build: ../payverify-whatsapp-bot
    restart: unless-stopped
    depends_on: [api]
    environment:
      PV_COMBANK_NIC: ${PV_COMBANK_NIC:-}
      PV_COMBANK_WHATSAPP_NUMBER: ${PV_COMBANK_WHATSAPP_NUMBER:-}
      PV_API_URL: http://api:8000
      PV_BOT_SECRET: ${PV_WHATSAPP_BOT_SECRET:-}
      WHATSAPP_AUTH_DIR: /data/auth
      SYNC_INTERVAL_MINUTES: ${PV_WHATSAPP_SYNC_INTERVAL_MINUTES:-60}
    volumes:
      - whatsapp_auth:/data/auth

  retention:            # run daily:  docker compose ... run --rm retention
    profiles: ["jobs"]
    build: ../payverify
    depends_on: { db: { condition: service_healthy } }
    environment: *apienv
    volumes: [proofs:/srv/storage]
    command: ["python", "-m", "app.retention", "--apply"]

volumes: { pgdata: {}, proofs: {}, caddy_data: {}, caddy_config: {}, whatsapp_auth: {} }
